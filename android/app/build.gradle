plugins {
    id 'com.android.application'
}

// Signing details live in android/keystore.properties (never committed):
//   storeFile=/path/to/elsha-release.jks
//   storePassword=...
//   keyAlias=elsha
//   keyPassword=...
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.jacknjose.elsha'
    compileSdk 35

    defaultConfig {
        applicationId 'in.co.jacknjose.elsha'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
